<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>NPSF Vault - Uncompressed Multi-File Archiver</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0f172a; /* slate-900 */
      color: #f8fafc; /* slate-50 */
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Custom scrollbar for file lists */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5); 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8); 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 1); 
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    // --- Utility Constants & Functions ---
    const MAGIC_STRING = 'NPSFARCH';
    const MAGIC_BYTES = new TextEncoder().encode(MAGIC_STRING);

    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    // --- Main Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('pack');
      
      // Pack State
      const [packFiles, setPackFiles] = useState([]);
      const [archiveName, setArchiveName] = useState('archive');
      
      // Unpack State
      const [unpackFile, setUnpackFile] = useState(null);
      const [extractedFiles, setExtractedFiles] = useState([]);
      
      // Shared State
      const [isProcessing, setIsProcessing] = useState(false);
      const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
      const [dragActive, setDragActive] = useState(false);
      
      const fileInputRef = useRef(null);

      // Cleanup object URLs when component unmounts or active tab changes to prevent memory leaks
      useEffect(() => {
        return () => {
          extractedFiles.forEach(f => URL.revokeObjectURL(f.url));
        };
      }, [extractedFiles]);

      const resetState = () => {
        setStatusMsg({ type: '', text: '' });
      };

      // --- Drag and Drop Handlers ---
      const handleDrag = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") setDragActive(true);
        else if (e.type === "dragleave") setDragActive(false);
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        resetState();

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const filesArray = Array.from(e.dataTransfer.files);
          
          if (activeTab === 'pack') {
            setPackFiles(prev => [...prev, ...filesArray]);
          } else {
            // Unpack only takes one NPSF file
            const file = filesArray[0];
            if (file.name.endsWith('.npsf')) {
              handleUnpackSelection(file);
            } else {
              setStatusMsg({ type: 'error', text: 'Please drop a valid .npsf file.' });
            }
          }
        }
      }, [activeTab]);

      const handleFileInput = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          resetState();
          const filesArray = Array.from(e.target.files);
          
          if (activeTab === 'pack') {
            setPackFiles(prev => [...prev, ...filesArray]);
          } else {
            handleUnpackSelection(filesArray[0]);
          }
        }
        // Reset input value to allow selecting the same file again if needed
        e.target.value = '';
      };

      // --- Core Packer Logic ---
      const executePack = () => {
        if (packFiles.length === 0) return;
        setIsProcessing(true);
        setStatusMsg({ type: 'info', text: 'Building zero-compression archive...' });

        try {
          // 1. Create Header Data
          const headerMetadata = packFiles.map(file => ({
            name: file.name,
            size: file.size,
            type: file.type || 'application/octet-stream'
          }));
          
          const headerJsonStr = JSON.stringify(headerMetadata);
          const headerBytes = new TextEncoder().encode(headerJsonStr);

          // 2. Create 4-byte length buffer for header (Little-Endian)
          const lengthBuffer = new ArrayBuffer(4);
          const lengthView = new DataView(lengthBuffer);
          lengthView.setUint32(0, headerBytes.length, true);

          // 3. Assemble final blob efficiently without reading file contents into RAM
          const blobParts = [
            MAGIC_BYTES, 
            lengthBuffer, 
            headerBytes, 
            ...packFiles
          ];
          
          const npsfBlob = new Blob(blobParts, { type: 'application/x-npsf' });

          // 4. Trigger Download
          const finalName = archiveName.trim() ? `${archiveName.trim()}.npsf` : 'archive.npsf';
          const url = URL.createObjectURL(npsfBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          setStatusMsg({ type: 'success', text: `Successfully created ${finalName}` });
        } catch (err) {
          console.error(err);
          setStatusMsg({ type: 'error', text: `Failed to pack: ${err.message}` });
        } finally {
          setIsProcessing(false);
        }
      };

      // --- Core Unpacker Logic ---
      const handleUnpackSelection = async (file) => {
        setUnpackFile(file);
        setExtractedFiles([]); // clear previous
        setIsProcessing(true);
        setStatusMsg({ type: 'info', text: 'Reading NPSF metadata...' });

        try {
          // 1. Validate Magic String (8 bytes)
          const magicSlice = file.slice(0, 8);
          const magicBuf = await magicSlice.arrayBuffer();
          const magicStr = new TextDecoder().decode(magicBuf);
          
          if (magicStr !== MAGIC_STRING) {
            throw new Error('Invalid magic signature. Not a valid NPSF file.');
          }

          // 2. Read Header Length (4 bytes, Little-Endian)
          const lenSlice = file.slice(8, 12);
          const lenBuf = await lenSlice.arrayBuffer();
          const headerLen = new DataView(lenBuf).getUint32(0, true);

          // 3. Read Header JSON
          const headerSlice = file.slice(12, 12 + headerLen);
          const headerBuf = await headerSlice.arrayBuffer();
          const headerJson = new TextDecoder().decode(headerBuf);
          const headerMetadata = JSON.parse(headerJson);

          // 4. Map File Blobs
          let currentOffset = 12 + headerLen;
          const extracted = [];

          for (const meta of headerMetadata) {
            // Memory efficient: slice the parent file blob directly. No RAM overhead.
            const fileBlob = file.slice(currentOffset, currentOffset + meta.size, meta.type);
            extracted.push({
              id: Math.random().toString(36).substring(7),
              name: meta.name,
              size: meta.size,
              type: meta.type,
              url: URL.createObjectURL(fileBlob)
            });
            currentOffset += meta.size;
          }

          if (currentOffset !== file.size) {
            console.warn(`File size mismatch. Expected ${currentOffset}, got ${file.size}. Archive may be incomplete or corrupted, but extracting what we can.`);
          }

          setExtractedFiles(extracted);
          setStatusMsg({ type: 'success', text: `Successfully parsed ${extracted.length} files.` });
        } catch (err) {
          console.error(err);
          setUnpackFile(null);
          setStatusMsg({ type: 'error', text: `Extraction failed: ${err.message}` });
        } finally {
          setIsProcessing(false);
        }
      };

      // --- UI Sub-Components ---
      
      // Total size calculation for Pack tab
      const totalPackSize = packFiles.reduce((acc, f) => acc + f.size, 0);

      const removePackFile = (indexToRemove) => {
        setPackFiles(prev => prev.filter((_, idx) => idx !== indexToRemove));
        resetState();
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col items-center py-12 px-4 relative selection:bg-cyan-500/30">
          {/* Ambient Background Blur */}
          <div className="absolute top-0 left-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-[128px] pointer-events-none"></div>
          <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-900/20 rounded-full blur-[128px] pointer-events-none"></div>

          <div className="w-full max-w-3xl z-10">
            {/* Header */}
            <div className="text-center mb-10">
              <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight">
                NPSF Vault
              </h1>
              <p className="text-slate-400 mt-3 font-medium">
                Uncompressed Multi-File Archiver. Combine without altering.
              </p>
            </div>

            {/* Main Card */}
            <div className="bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl overflow-hidden">
              
              {/* Tab Navigation */}
              <div className="flex border-b border-slate-700/50 bg-slate-800/80">
                <button
                  onClick={() => { setActiveTab('pack'); resetState(); }}
                  className={`flex-1 py-4 text-sm font-bold uppercase tracking-wider transition-colors ${
                    activeTab === 'pack' 
                      ? 'text-cyan-400 border-b-2 border-cyan-400 bg-slate-800/50' 
                      : 'text-slate-500 hover:text-slate-300 hover:bg-slate-700/30'
                  }`}
                >
                  <div className="flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                    </svg>
                    Pack (Encode)
                  </div>
                </button>
                <button
                  onClick={() => { setActiveTab('unpack'); resetState(); }}
                  className={`flex-1 py-4 text-sm font-bold uppercase tracking-wider transition-colors ${
                    activeTab === 'unpack' 
                      ? 'text-blue-400 border-b-2 border-blue-400 bg-slate-800/50' 
                      : 'text-slate-500 hover:text-slate-300 hover:bg-slate-700/30'
                  }`}
                >
                  <div className="flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
                    </svg>
                    Unpack (Decode)
                  </div>
                </button>
              </div>

              <div className="p-8">
                
                {/* --- PACK TAB CONTENT --- */}
                {activeTab === 'pack' && (
                  <div className="space-y-6">
                    {/* Dropzone */}
                    <div
                      className={`relative border-2 border-dashed rounded-2xl p-10 text-center transition-all duration-300 ease-out cursor-pointer group ${
                        dragActive 
                          ? 'border-cyan-500 bg-cyan-500/10 scale-[1.01]' 
                          : 'border-slate-600 hover:border-slate-500 hover:bg-slate-700/30'
                      }`}
                      onDragEnter={handleDrag}
                      onDragLeave={handleDrag}
                      onDragOver={handleDrag}
                      onDrop={handleDrop}
                      onClick={() => fileInputRef.current?.click()}
                    >
                      <input
                        ref={fileInputRef}
                        type="file"
                        multiple
                        className="hidden"
                        onChange={handleFileInput}
                      />
                      <div className="p-4 bg-slate-800 rounded-full inline-block mb-4 shadow-lg group-hover:scale-110 transition-transform">
                        <svg className="w-8 h-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                        </svg>
                      </div>
                      <p className="text-lg font-medium text-slate-200 mb-1">
                        Select files or drag & drop here
                      </p>
                      <p className="text-sm text-slate-500">
                        Add as many files as you want. Zero compression means zero quality loss.
                      </p>
                    </div>

                    {/* File List for Packing */}
                    {packFiles.length > 0 && (
                      <div className="bg-slate-900/50 rounded-2xl border border-slate-700/50 overflow-hidden flex flex-col">
                        <div className="p-4 border-b border-slate-700/50 bg-slate-800/30 flex justify-between items-center">
                          <h3 className="font-semibold text-slate-200">Files to Pack ({packFiles.length})</h3>
                          <span className="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-slate-400 border border-slate-700">
                            Total: {formatBytes(totalPackSize)}
                          </span>
                        </div>
                        
                        <div className="max-h-64 overflow-y-auto custom-scrollbar p-2">
                          <ul className="space-y-1">
                            {packFiles.map((file, idx) => (
                              <li key={`${file.name}-${idx}`} className="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800/60 transition-colors group">
                                <div className="flex items-center gap-3 overflow-hidden">
                                  <svg className="w-5 h-5 text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                  </svg>
                                  <span className="text-sm text-slate-300 truncate font-medium">{file.name}</span>
                                </div>
                                <div className="flex items-center gap-4 shrink-0 pl-2">
                                  <span className="text-xs text-slate-500 tabular-nums">{formatBytes(file.size)}</span>
                                  <button 
                                    onClick={(e) => { e.stopPropagation(); removePackFile(idx); }}
                                    className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100"
                                    title="Remove file"
                                  >
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                  </button>
                                </div>
                              </li>
                            ))}
                          </ul>
                        </div>
                        
                        <div className="p-4 bg-slate-800/40 border-t border-slate-700/50">
                          <div className="flex gap-4 items-end">
                            <div className="flex-1">
                              <label className="block text-xs text-slate-500 mb-1.5 font-medium ml-1">Archive Name</label>
                              <div className="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-cyan-500/50 focus-within:ring-1 focus-within:ring-cyan-500/50 transition-all">
                                <input 
                                  type="text" 
                                  value={archiveName}
                                  onChange={(e) => setArchiveName(e.target.value)}
                                  className="bg-transparent text-sm text-slate-200 w-full py-3 px-4 outline-none"
                                  placeholder="my_collection"
                                />
                                <span className="text-sm font-mono text-slate-500 pr-4 select-none">.npsf</span>
                              </div>
                            </div>
                            <button
                              onClick={executePack}
                              disabled={isProcessing}
                              className="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[160px]"
                            >
                              {isProcessing ? 'Packing...' : 'Pack Archive'}
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* --- UNPACK TAB CONTENT --- */}
                {activeTab === 'unpack' && (
                  <div className="space-y-6">
                     {/* Dropzone (Only show if no file is currently being unpacked/extracted) */}
                     {!unpackFile && extractedFiles.length === 0 && (
                      <div
                        className={`relative border-2 border-dashed rounded-2xl p-10 text-center transition-all duration-300 ease-out cursor-pointer ${
                          dragActive 
                            ? 'border-blue-500 bg-blue-500/10 scale-[1.01]' 
                            : 'border-slate-600 hover:border-slate-500 hover:bg-slate-700/30'
                        }`}
                        onDragEnter={handleDrag}
                        onDragLeave={handleDrag}
                        onDragOver={handleDrag}
                        onDrop={handleDrop}
                        onClick={() => fileInputRef.current?.click()}
                      >
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".npsf"
                          className="hidden"
                          onChange={handleFileInput}
                        />
                        <div className="p-4 bg-slate-800 rounded-full inline-block mb-4 shadow-lg">
                          <svg className="w-8 h-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
                          </svg>
                        </div>
                        <p className="text-lg font-medium text-slate-200 mb-1">
                          Select a .npsf file to unpack
                        </p>
                        <p className="text-sm text-slate-500 mt-2">
                          Instantly reads metadata without loading the entire archive into memory.
                        </p>
                      </div>
                     )}

                     {/* Extracted Files List */}
                     {(unpackFile || extractedFiles.length > 0) && (
                        <div className="bg-slate-900/50 rounded-2xl border border-slate-700/50 overflow-hidden flex flex-col">
                          
                          <div className="p-5 border-b border-slate-700/50 bg-slate-800/60 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                              <div className="p-2.5 bg-blue-500/10 rounded-xl border border-blue-500/20">
                                <svg className="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                </svg>
                              </div>
                              <div>
                                <h3 className="font-bold text-slate-200 tracking-wide">{unpackFile?.name || 'Archive'}</h3>
                                <p className="text-xs text-slate-400 mt-0.5">
                                  {extractedFiles.length} files inside
                                </p>
                              </div>
                            </div>
                            
                            <button 
                              onClick={() => { setUnpackFile(null); setExtractedFiles([]); resetState(); }}
                              className="text-xs font-semibold text-slate-400 hover:text-white px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors border border-slate-700"
                            >
                              Close Archive
                            </button>
                          </div>

                          <div className="max-h-[400px] overflow-y-auto custom-scrollbar p-3">
                            {extractedFiles.length === 0 && isProcessing ? (
                              <div className="flex flex-col items-center justify-center py-12 text-slate-400">
                                <svg className="animate-spin h-8 w-8 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Reading Archive structure...
                              </div>
                            ) : (
                              <div className="grid gap-2">
                                {extractedFiles.map((file) => (
                                  <div key={file.id} className="flex items-center justify-between p-4 bg-slate-800/30 rounded-xl border border-slate-700/30 hover:border-blue-500/30 transition-colors">
                                    <div className="flex items-center gap-3 min-w-0 pr-4">
                                      <svg className="w-8 h-8 text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                      </svg>
                                      <div className="min-w-0">
                                        <p className="text-sm font-medium text-slate-200 truncate" title={file.name}>
                                          {file.name}
                                        </p>
                                        <p className="text-xs font-mono text-slate-500 mt-0.5">
                                          {formatBytes(file.size)} &bull; {file.type || 'Unknown type'}
                                        </p>
                                      </div>
                                    </div>
                                    
                                    <a 
                                      href={file.url} 
                                      download={file.name}
                                      className="shrink-0 flex items-center gap-2 bg-blue-500/10 hover:bg-blue-500 text-blue-400 hover:text-white px-4 py-2 rounded-lg text-sm font-bold transition-all border border-blue-500/20"
                                    >
                                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                      </svg>
                                      Download
                                    </a>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                     )}
                  </div>
                )}

                {/* Status Messaging Area */}
                {statusMsg.text && (
                  <div className={`mt-6 p-4 rounded-xl text-sm font-medium border flex items-center gap-3 animate-in fade-in slide-in-from-bottom-2 ${
                    statusMsg.type === 'error' ? 'bg-red-500/10 border-red-500/20 text-red-400' : 
                    statusMsg.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 
                    'bg-blue-500/10 border-blue-500/20 text-blue-400'
                  }`}>
                    {statusMsg.type === 'error' && (
                       <svg className="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    )}
                    {statusMsg.type === 'success' && (
                       <svg className="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    )}
                    {statusMsg.type === 'info' && (
                       <svg className="w-5 h-5 shrink-0 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    )}
                    <span className="truncate">{statusMsg.text}</span>
                  </div>
                )}

              </div>
            </div>
            
            <p className="text-center text-slate-500 text-xs mt-8">
              All processing happens securely in your browser. No files are uploaded to any server.
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
